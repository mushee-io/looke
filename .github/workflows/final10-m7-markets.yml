name: Final10 M7 independently verified markets and safe swap reviews
on:
  pull_request:
jobs:
  market-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Strict market source, wallet, calldata, deadline, replay and zero-broadcast tests
        run: npm run test:final-m7
      - name: Full TypeScript review
        run: npm run typecheck
      - name: Production-safe Next build (all financial actions closed)
        run: npm run build
        env:
          LOOKE_M7_MARKET_REVIEW_WRITES_ENABLED: 'false'
          LOOKE_M7_OPERATOR_SOURCE_APPROVED: 'false'
          LOOKE_M4_TRADING_ENABLED: 'false'
          LOOKE_SOCIAL_WRITES_ENABLED: 'false'
          LOOKE_M2_IDENTITY_WRITES_ENABLED: 'false'
          LOOKE_M3_SOCIAL_WRITES_ENABLED: 'false'
          LOOKE_M6_CREATOR_PREVIEW_WRITES_ENABLED: 'false'
          LOOKE_PUBLIC_BETA_ENABLED: 'false'
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: looke_m7_ci
          POSTGRES_USER: looke_m7
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U looke_m7 -d looke_m7_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://looke_m7:ci_only_password@localhost:5432/looke_m7_ci
      LOOKE_SOCIAL_APP_ORIGIN: http://localhost:3000
      LOOKE_SOCIAL_WRITES_ENABLED: 'false'
      LOOKE_M2_IDENTITY_WRITES_ENABLED: 'true'
      LOOKE_M3_SOCIAL_WRITES_ENABLED: 'true'
      LOOKE_M7_MARKET_REVIEW_WRITES_ENABLED: 'true'
      LOOKE_M7_OPERATOR_SOURCE_APPROVED: 'false'
      LOOKE_M4_TRADING_ENABLED: 'false'
      LOOKE_PUBLIC_BETA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Migrate disposable CI-only social schema; never legacy Neon
        run: npm run db:migrate
      - name: Signed owner intent isolation, uniqueness, forbidden data, wrong origin, source NO-GO
        run: npm run test:final-m7-db
  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Existing M6 creator contracts compile without deployment
        run: forge build
      - name: M6 ERC-20 factory nonce replay / existing Solidity regressions
        run: forge test -vv
